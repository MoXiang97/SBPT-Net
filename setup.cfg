[metadata]
name = sbpt-net
version = 0.2.0
description = Superline-based synthetic-to-real domain generalization for gauge line segmentation in shoe upper point clouds
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = Xiang Mo

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    scipy>=1.10
    torch>=2.1
    PyYAML>=6.0
    tqdm>=4.65

[options.packages.find]
include = s2rspc*

[options.extras_require]
dev =
    pytest>=7.4
    ruff>=0.4
plots =
    matplotlib>=3.7
    pandas>=2.0
    Pillow>=10.0

[options.entry_points]
console_scripts =
    sbptnet-preprocess = s2rspc.cli.preprocess:main
    sbptnet-train = s2rspc.cli.train:main
    sbptnet-evaluate = s2rspc.cli.evaluate:main
    sbptnet-infer = s2rspc.cli.infer:main
    sbptnet-toy-demo = s2rspc.cli.toy_demo:main
